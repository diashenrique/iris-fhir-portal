services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: --check-caps false
    # The image's WORKDIR is the bind-mounted checkout below, which irisowner cannot write to;
    # keep the runtime cwd off it so iris-main.log is writable.
    working_dir: /home/irisowner
    ports:
      - 127.0.0.1:32782:1972
      - 127.0.0.1:32783:52773
    volumes:
#      - ~/iris.key:/usr/irissys/mgr/iris.key
      - ./:/home/irisowner/dev
