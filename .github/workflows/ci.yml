name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      portal_source:
        description: 'Install leg: this checkout (zpm load) or the published package (zpm install fhir-portal)'
        type: choice
        options: [checkout, registry]
        default: checkout

# A new push to a PR replaces its running build; runs on master always finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vendor:
    name: Vendored frontend libraries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vendor/package-lock.json

      # The files in fhirUI/assets/vendor must be the npm packages of vendor/package-lock.json, byte for byte
      # Only files are copied: no package needs its install scripts
      - name: Vendor check
        working-directory: vendor
        run: |
          npm ci --ignore-scripts
          node sync.mjs --check

      # Known advisories (moderate or worse) in any library the portal serves fail the build
      - name: Vendor audit
        working-directory: vendor
        run: npm audit --audit-level=moderate

  build:
    # docker: the project's image (Dockerfile + iris.script); ipm: a clean IRIS for Health with the fhir-server
    # package (the iris-fhir-template) and this checkout's module.xml, the way IPM users install the portal
    name: ${{ matrix.install == 'docker' && 'Build image and check FHIR data' || 'Install through IPM' }}
    runs-on: ubuntu-24.04  # pinned: the IRIS latest-cd image is the only intended moving part
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        install: [docker, ipm]
    env:
      BASE_URL: http://localhost:32783
      # How the steps below reach the IRIS container of each install
      IRIS_EXEC: ${{ matrix.install == 'docker' && 'docker compose exec -T iris' || 'docker exec -i fhirportal-ipm' }}
    defaults:
      run:
        shell: bash  # -eo pipefail: a failing curl fails the step instead of feeding jq empty input

    steps:
      - uses: actions/checkout@v7

      # The IRIS for Health image alone is ~6 GB; drop preinstalled toolchains the build does not use
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build image
        if: matrix.install == 'docker'
        run: docker compose build --progress=plain

      - name: Start container
        if: matrix.install == 'docker'
        run: docker compose up -d

      - name: Install IPM, fhir-server and the portal module
        if: matrix.install == 'ipm'
        env:
          PORTAL_SOURCE: ${{ inputs.portal_source || 'checkout' }}
        run: PORT=32783 bash scripts/ipm-install.sh

      # The wait signs in as the demo user, so it also proves that credential works before the tests
      - name: Wait for FHIR server
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s --max-time 10 -u fhirportal:fhirportal -o /dev/null -w '%{http_code}' "$BASE_URL/fhir/r4/metadata" || true)
            [ "$code" = "200" ] && echo "FHIR server up after $((i * 5))s" && exit 0
            sleep 5
          done
          echo "FHIR server did not answer 200 on /fhir/r4/metadata (last: $code)"
          exit 1

      # iris session exits 0 even when a line of iris.script fails, so the build result alone proves nothing
      - name: Check FHIR data was loaded
        run: |
          total=$(curl -sSf --max-time 30 -u fhirportal:fhirportal -H 'Accept: application/fhir+json' \
            "$BASE_URL/fhir/r4/Patient?_summary=count" | jq -r '.total // 0')
          echo "Patients loaded: $total"
          [ "$total" -gt 0 ]

      - name: Smoke test
        run: bash scripts/smoke.sh

      # The roles of /fhir/api read the FHIR tables and cannot write to them (SQLCODE -99)
      - name: Read-only /fhir/api
        run: bash scripts/check-readonly.sh

      # Every SQL example of README.md, README-JP.md and misc/sql/example.sql runs against this server
      - name: Documentation SQL examples
        run: bash scripts/check-readme-sql.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: E2E
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      # An anonymous call that makes CSP look for a login page it does not have logs a severity-2 alert
      # and leaves the container unhealthy (bug 2.8); none may show up after the tests
      - name: No CSP login-page alerts
        run: |
          # grep exits 0 on a match, 1 on none and 2 on an error; docker compose exec fails if the container is down
          set +e
          $IRIS_EXEC grep "Error displaying login page" /usr/irissys/mgr/messages.log
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then echo "messages.log has CSP login-page alerts"; exit 1; fi
          if [ "$status" -ne 1 ]; then echo "could not read messages.log (exit $status)"; exit 1; fi
          echo "no CSP login-page alerts"

      - name: E2E report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.install }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

      - name: Container logs
        if: failure()
        run: |
          if [ "${{ matrix.install }}" = docker ]; then docker compose logs --tail=200; else docker logs --tail=200 fhirportal-ipm; fi
