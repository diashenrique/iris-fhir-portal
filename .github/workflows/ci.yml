name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a PR replaces its running build; runs on master always finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build image and check FHIR data
    runs-on: ubuntu-24.04  # pinned: the IRIS latest-cd image is the only intended moving part
    timeout-minutes: 45
    env:
      BASE_URL: http://localhost:32783
    defaults:
      run:
        shell: bash  # -eo pipefail: a failing curl fails the step instead of feeding jq empty input

    steps:
      - uses: actions/checkout@v7

      # The IRIS for Health image alone is ~6 GB; drop preinstalled toolchains the build does not use
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build image
        run: docker compose build --progress=plain

      - name: Start container
        run: docker compose up -d

      # The wait signs in as the demo user, so it also proves that credential works before the tests
      - name: Wait for FHIR server
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s --max-time 10 -u fhirportal:fhirportal -o /dev/null -w '%{http_code}' "$BASE_URL/fhir/r4/metadata" || true)
            [ "$code" = "200" ] && echo "FHIR server up after $((i * 5))s" && exit 0
            sleep 5
          done
          echo "FHIR server did not answer 200 on /fhir/r4/metadata (last: $code)"
          exit 1

      # iris session exits 0 even when a line of iris.script fails, so the build result alone proves nothing
      - name: Check FHIR data was loaded
        run: |
          total=$(curl -sSf --max-time 30 -u fhirportal:fhirportal -H 'Accept: application/fhir+json' \
            "$BASE_URL/fhir/r4/Patient?_summary=count" | jq -r '.total // 0')
          echo "Patients loaded: $total"
          [ "$total" -gt 0 ]

      - name: Smoke test
        run: bash scripts/smoke.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: E2E
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      # An anonymous call that makes CSP look for a login page it does not have logs a severity-2 alert
      # and leaves the container unhealthy (bug 2.8); none may show up after the tests
      - name: No CSP login-page alerts
        run: |
          # grep exits 0 on a match, 1 on none and 2 on an error; docker compose exec fails if the container is down
          set +e
          docker compose exec -T iris grep "Error displaying login page" /usr/irissys/mgr/messages.log
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then echo "messages.log has CSP login-page alerts"; exit 1; fi
          if [ "$status" -ne 1 ]; then echo "could not read messages.log (exit $status)"; exit 1; fi
          echo "no CSP login-page alerts"

      - name: E2E report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

      - name: Container logs
        if: failure()
        run: docker compose logs --tail=200
