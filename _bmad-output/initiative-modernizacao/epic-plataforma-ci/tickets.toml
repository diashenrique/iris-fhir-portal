title = "Badge do CI e merge em master"
description = "Adiciona ao README o badge do workflow ci.yml e o comando do smoke test, e faz o merge do branch modernizacao-iris-2026 em master."
verify = "O workflow roda verde em master depois do merge e o badge no README mostra passing."
